server {
    listen 80;
    server_name _;
    root /srv/rpi-repo;
    autoindex off;

    location / {
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        deny all;
    }

    location ~ /(.*)/conf {
        deny all;
        return 404;
    }

    location ~ /(.*)/db {
        deny all;
        return 404;
    }
}
